<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ustaz AI</title>
  <meta name="description" content="Ustaz AI — виртуальный наставник колледжа">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="logo" data-action="logo" aria-label="Ustaz AI">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="19" fill="var(--primary)"/>
        <circle cx="20" cy="20" r="8" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
        <path d="M8 13c6 2 9 4 12 7 3-3 6-5 12-7M8 27c6-2 9-4 12-7 3 3 6 5 12 7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span>
        <span class="logo-name">Ustaz AI</span>
        <span class="logo-tag" data-i18n="tagline"></span>
      </span>
    </button>

    <div class="controls">
      <div id="userbox" class="userbox"></div>
      <div class="segmented" role="group" aria-label="Язык / Тіл">
        <button data-lang="kk">Қаз</button>
        <button data-lang="ru">Рус</button>
      </div>
    </div>
  </header>

  <main id="main" class="container"></main>
  <div id="modal-root"></div>

  <script src="js/i18n.js"></script>
  <script defer src="js/lecture-view.js"></script>
  <script defer src="js/materials.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
